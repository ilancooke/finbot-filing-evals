[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finbot-filing-evals"
version = "0.1.0"
description = "Golden datasets and evaluation tools for earnings extraction from SEC documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
finbot-eval-eps = "finbot_filing_evals.evaluation.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
eval = ["pyarrow>=19"]
bedrock = ["boto3>=1.42,<2", "html5lib>=1.1,<2", "Pillow>=12,<13"]
openai = ["openai>=2.54,<3", "html5lib>=1.1,<2", "Pillow>=12,<13"]
anthropic = ["anthropic>=1.17,<2", "html5lib>=1.1,<2", "Pillow>=12,<13"]
review = [
    "Pillow>=12,<13",
    "streamlit>=1.50,<2", "pandas>=2.2,<4", "pyarrow>=19",
    "bleach[css]>=6.2,<7", "html5lib>=1.1,<2", "tinycss2>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finbot_filing_evals.review" = ["schemas/*.json"]
"finbot_filing_evals.evaluation" = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
